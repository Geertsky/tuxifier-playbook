---

- name: Bambini
  hosts: installer-uefi,installer-bios
  tasks:
    - name: Import role bambini
      ansible.builtin.import_role:
        name: geertsky.bambini.ansible_bambini
      environment:
        PATH: "/local/conda/envs/bambini-python/sbin:/local/conda/envs/bambini-python/bin:{{ ansible_facts['env']['PATH'] | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin') }}"
        CONDA_PREFIX: "/local/conda/envs/bambini-python"

    - name: "Wait for bootup to finish"
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600

    - name: Gather facts for first time
      ansible.builtin.setup:

    - name: Continue install
      when: continue_install is defined and continue_install
      ansible.builtin.include_tasks:
        file: continue_install.yml
      vars:
        ansible_python_interpreter: >-
          {{ '/usr/bin/python3'
            if ansible_facts['distribution_major_version'] | int == 8
            else 'auto_silent'}}
