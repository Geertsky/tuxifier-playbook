---

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname | default('installer') }}"

- name: Install Apache
  ansible.builtin.package:
    name: httpd

- name: Install demo page
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    mode: "0644"
    owner: apache
    group: apache
    content: >
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <title>Freshly installed Webserver</title>
      </head>
      <body>
      <h1>Hello, World!</h1>
      I am a freshly installed webserver using Ansible and tuxifier!
      </body>
      </html>
      <html>
# The firewall bindings of the python that runs the modules of version 8 do not exist, so the module cannot be used.
- name: Open firewall http service
  when: ansible_facts['distribution_major_version'] != '8'
  ansible.posix.firewalld:
    service: http
    state: enabled
    permanent: true
    immediate: true
    offline: true

- name: Open firewall http service on version 8
  when: ansible_facts['distribution_major_version'] == '8'
  block:
    - name: Query firewall http service
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --query-service=http
      register: _firewall_http
      changed_when: false
      failed_when: _firewall_http.rc not in [0, 1]

    - name: Enable firewall http service
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --add-service=http
      when: _firewall_http.rc == 1
      register: _firewall_http_added

    # firewalld is already running on the first boot of the installed system and does not read the files that firewall-offline-cmd wrote.
    - name: Restart firewalld to load the http service
      ansible.builtin.systemd_service:
        name: firewalld
        state: restarted
      when: _firewall_http_added is changed

- name: Enable and start Firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Enable and start httpd
  ansible.builtin.systemd_service:
    name: httpd
    enabled: true
    state: started

# The storage role puts the /tuxifier-sysroot mounts in the fstab of the initramfs. The systemd of version 8 generates mount units
# from them that fail ("already mounted on /sysroot"), and the failed state is carried into the installed system.
# The ? matches the backslash in the unit name tuxifier\x2dsysroot.mount.
- name: Reset the failed mount units of the installer
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - 'tuxifier?x2dsysroot*.mount'
  changed_when: false
  failed_when: false

# The role skips its relabel when continue_install is true, so the first boot of the installed system ran on unlabeled files.
# Only when the files are still unlabeled (unlabeled_t, or ? when SELinux is off), so that a repeated run does not relabel again.
- name: Check that the installed system is labeled
  when: (strict_selinux | default(false) | bool) and ansible_facts['selinux']['status'] | default('disabled') != 'disabled'
  block:
    - name: Read the label of sshd
      ansible.builtin.command:
        argv:
          - ls
          - -Z
          - /usr/sbin/sshd
      register: _sshd_label
      changed_when: false

    - name: Relabel the installed system at the next boot
      ansible.builtin.command:
        argv:
          - fixfiles
          - -F
          - onboot
      when: _sshd_label.stdout is search('unlabeled_t') or _sshd_label.stdout is match('^[?]')
