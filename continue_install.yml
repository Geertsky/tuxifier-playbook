---

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname | default('installer') }}"

- name: Install Apache
  ansible.builtin.package:
    name: httpd

- name: Install demo page
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    mode: "0644"
    owner: apache
    group: apache
    content: >
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <title>Freshly installed Webserver</title>
      </head>
      <body>
      <h1>Hello, World!</h1>
      I am a freshly installed webserver using Ansible and tuxifier!
      </body>
      </html>
      <html>
- name: Open firewall http service
  ansible.builtin.firewalld:
    service: http
    state: enabled
    permanent: true
    immediate: true
    offline: true

- name: Enable and start Firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Enable and start httpd
  ansible.builtin.systemd_service:
    name: httpd
    enabled: true
    state: started

