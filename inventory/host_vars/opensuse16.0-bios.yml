installdistribution:
  name: opensuse
  version: 16.0

root_authorized_keys:
  - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOm4c78woS/1JU/A+jeAuKjuThZSH7qUbzuS+ldogq2v geert@clt-mgt05'

strict_selinux: false # Touches /.autorelabel

continue_install: false # When true, then it needs current kernel version == installed kernel version. This is forced by tuxifier.

rootpw: rootpw
# force_filesystem: true  (was set in the previous layout)
installdisk:
  - name: /dev/vda
    type: partition
    disks: [/dev/vda]
    volumes:
      - name: "1"
        size: 1MiB
        fs_type: biosboot

      - name: "2"
        size: 1022MiB
        fs_type: ext3
        fs_label: boot
        fs_create_options: "-O ^orphan_file"
        mount_point: /boot
        mount_options: defaults

      - name: "3"
        size: "0"
        fs_type: lvmpv

  - name: vg.rh
    type: lvm
    disks: [/dev/vda3]
    volumes:
      - name: swap
        size: 512M
        fs_type: swap
        fs_label: swap

      - name: root
        size: 100%
        fs_type: ext4
        fs_label: root
        fs_create_options: "-O ^orphan_file"
        mount_point: /
        mount_options: defaults
