# rocky8-uefi with the data on an md RAID1 across two extra disks.
# Needs the VirtIO disks /dev/vdb and /dev/vdc (>= 3 GiB) besides /dev/vda.
installdistribution:
  name: rocky
  version: 8
  repo:
    type: baseurl
    url: http://192.168.122.1/rocky/8/BaseOS/x86_64/os/

root_authorized_keys:
  - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOm4c78woS/1JU/A+jeAuKjuThZSH7qUbzuS+ldogq2v geert@clt-mgt05'

strict_selinux: true # Touches /.autorelabel

continue_install: false # When true, then it needs current kernel version == installed kernel version. This is forced by tuxifier.

hostname: installer8-uefi

rootpw: rootpw
storage_disklabel_type: gpt
installdisk:
  - name: /dev/vda
    type: partition
    disks: [/dev/vda]
    volumes:
      - name: "1"
        size: 1GiB
        fs_type: ext3
        fs_label: boot
        fs_create_options: "-O ^orphan_file"
        mount_point: /boot
        mount_options: defaults

      - name: "2"
        size: 1GiB
        fs_type: efi
        fs_label: EFI
        mount_point: /boot/efi
        mount_options: "umask=0077,shortname=winnt"

      - name: "3"
        size: "0"
        fs_type: lvmpv

  - name: vg.rh
    type: lvm
    disks: [/dev/vda3]
    volumes:
      - name: swap
        size: 512M
        fs_type: swap
        fs_label: swap

      - name: root
        size: 5GiB
        fs_type: ext3
        fs_label: root
        fs_create_options: "-O ^orphan_file"
        mount_point: /
        mount_options: defaults

  # The volume group lives on an md RAID1 array with /dev/vdb and /dev/vdc as members.
  - name: vg.data
    type: lvm
    disks: [/dev/vdb, /dev/vdc]
    raid_level: raid1
    raid_device_count: 2
    volumes:
      - name: data
        size: 1GiB
        fs_type: ext4
        fs_label: data
        fs_create_options: "-O ^orphan_file"
        mount_point: /data
        mount_options: defaults
