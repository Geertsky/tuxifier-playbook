# Plain tox (no tox-lsr). Modelled on linux-system-roles.storage.
#
# The playbooks use the role geertsky.tuxifier.ansible_tuxifier. The lint and syntax-check
# environments install the sibling checkout ../tuxifier (TUXIFIER_COLLECTION) into a private
# collections path, so the local checkout is tested and not a released version.
[tox]
envlist = yamllint, ansible-lint, codespell, markdownlint, shellcheck, syntax-check
skipsdist = true
skip_missing_interpreters = true

[testenv]
skip_install = true
passenv = HOME
setenv =
    TUXIFIER_COLLECTION = {env:TUXIFIER_COLLECTION:{toxinidir}/../tuxifier}
    ANSIBLE_COLLECTIONS_PATH = {envtmpdir}/collections
    ANSIBLE_HOME = {envtmpdir}/ansible_home

[testenv:yamllint]
deps = yamllint
commands = yamllint -c .yamllint.yml {posargs:.}

[testenv:ansible-lint]
deps =
    ansible-core>=2.15
    ansible-lint
allowlist_externals = ansible-galaxy
commands_pre =
    ansible-galaxy collection install {env:TUXIFIER_COLLECTION} --force -p {envtmpdir}/collections
commands =
    ansible-lint -c {toxinidir}/.ansible-lint {posargs}

[testenv:codespell]
deps = codespell
commands = codespell --config {toxinidir}/.codespellrc {posargs} {toxinidir}

[testenv:markdownlint]
allowlist_externals = npx
commands = npx --yes markdownlint-cli --config {toxinidir}/.markdownlint.yaml --ignore .tox --ignore .ansible {posargs:"**/*.md"}

[testenv:shellcheck]
deps = shellcheck-py
allowlist_externals = bash
commands = bash -c 'shellcheck {toxinidir}/scripts/*.sh'

# Syntax check with a throwaway inventory: the real one needs inventory/host_vars/installer*.yml,
# which are never committed.
[testenv:syntax-check]
deps = ansible-core>=2.15
allowlist_externals =
    ansible-galaxy
    bash
setenv =
    {[testenv]setenv}
    ANSIBLE_INVENTORY = {envtmpdir}/inventory.ini
commands_pre =
    ansible-galaxy collection install {env:TUXIFIER_COLLECTION} --force -p {envtmpdir}/collections
    bash -c 'printf "[installer]\ninstaller-syntax-check\n" > {envtmpdir}/inventory.ini'
commands =
    ansible-playbook --syntax-check playbook.yml
